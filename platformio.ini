[platformio]
default_envs = tdisplay_s3
; Reuse the toolchains already installed for this project, including VS Code Upload.
core_dir = .tools/platformio

[env]
platform = espressif32@6.12.0
board = lilygo-t-display-s3
framework = espidf
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.embed_txtfiles = components/setup_portal/web/index.html
monitor_speed = 115200
extra_scripts = pre:tools/configure_build.py

[env:tdisplay_s3]
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS=sdkconfig.defaults

[env:tdisplay_s3_no_psram]
board_build.cmake_extra_args = -DSDKCONFIG_DEFAULTS="sdkconfig.defaults;sdkconfig.no_psram.defaults"
